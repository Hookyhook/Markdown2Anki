[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown2anki"
version = "0.2.0"
description = "Convert Obsidian flashcard notes into Anki decks"
requires-python = ">=3.9"
dependencies = [
    "Markdown>=3.8,<4",
    "genanki>=0.13.1,<0.14",
    "python-dotenv>=1.0,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
m2a = "markdown2anki.cli:main"

[tool.setuptools.packages.find]
include = ["markdown2anki*"]

[tool.setuptools.package-data]
markdown2anki = ["NoteTypes/*.html", "NoteTypes/*/*.html", "NoteTypes/*/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
